<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxi Chofer</title>
<link rel="manifest" href="/manifest-chofer.json">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taxi Chofer">
<link rel="apple-touch-icon" href="/icon-chofer.svg">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 4px;
    color: #60a5fa;
  }
  .subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #334155;
  }
  .card h2 {
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.78rem;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: #94a3b8;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    padding: 12px 14px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #f1f5f9;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #3b82f6; }
  .btn-registrar {
    width: 100%;
    padding: 13px;
    background: #3b82f6;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 18px;
    transition: background 0.2s;
  }
  .btn-registrar:hover { background: #60a5fa; }

  /* Dashboard (oculto hasta registrarse) */
  #dashboard { display: none; }

  .perfil {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatar {
    width: 50px; height: 50px;
    background: #3b82f6;
    color: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 800;
    flex-shrink: 0;
  }
  .perfil-info .nombre { font-size: 1.1rem; font-weight: 700; }
  .perfil-info .numero { font-size: 0.82rem; color: #64748b; }

  /* Toggle disponibilidad */
  .toggle-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    background: #0f172a;
    border: 2px solid #334155;
    transition: border-color 0.3s;
  }
  .toggle-wrap.activo { border-color: #22c55e; }
  .toggle-label { font-weight: 600; font-size: 0.95rem; }
  .toggle-sublabel { font-size: 0.78rem; color: #64748b; margin-top: 2px; }
  .switch {
    position: relative;
    width: 52px; height: 28px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    background: #475569;
    border-radius: 28px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .slider:before {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    background: white;
    border-radius: 50%;
    top: 4px; left: 4px;
    transition: transform 0.3s;
  }
  input:checked + .slider { background: #22c55e; }
  input:checked + .slider:before { transform: translateX(24px); }

  /* Solicitud entrante */
  #solicitud-card {
    display: none;
    animation: slideIn 0.35s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #solicitud-card.activa {
    display: block;
    background: #1c1917;
    border-color: #f59e0b;
  }
  .solicitud-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    font-size: 1rem;
    font-weight: 700;
    color: #fbbf24;
  }
  .ping {
    width: 14px; height: 14px;
    background: #f59e0b;
    border-radius: 50%;
    animation: ping 1s ease infinite;
    flex-shrink: 0;
  }
  @keyframes ping {
    0%,100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.5; }
  }
  .info-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 0.9rem;
  }
  .info-row .icon { width: 22px; text-align: center; flex-shrink: 0; }
  .info-row .valor { color: #e2e8f0; }
  .btns-solicitud {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .btn-aceptar {
    padding: 13px;
    background: #22c55e;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-aceptar:hover { background: #16a34a; }
  .btn-rechazar {
    padding: 13px;
    background: #334155;
    color: #f1f5f9;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-rechazar:hover { background: #475569; }
  .btn-maps {
    width: 100%;
    padding: 13px;
    background: #1d4ed8;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }
  .btn-maps:hover { background: #2563eb; }
  .btn-completar {
    width: 100%;
    padding: 13px;
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
    display: none;
  }
  .btn-completar:hover { background: #6d28d9; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #f1f5f9;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 0.88rem;
    border: 1px solid #334155;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  .btn-ubic {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #94a3b8;
    padding: 10px 14px;
    width: 100%;
    cursor: pointer;
    margin-top: 12px;
    font-size: 0.88rem;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-ubic.activo { border-color: #22c55e; color: #22c55e; }
</style>
</head>
<body>

<h1>🚖 Panel del Chofer</h1>
<p class="subtitle">Gestiona tus carreras en tiempo real</p>

<!-- Registro -->
<div class="card" id="registro-card">
  <h2>👤 Registro</h2>
  <label>Tu nombre / nombre del taxi</label>
  <input type="text" id="reg-nombre" placeholder="Ej: Taxi 01 — Juan">
  <label>Número de teléfono</label>
  <input type="tel" id="reg-numero" placeholder="Ej: 099 123 4567">
  <button class="btn-registrar" onclick="registrar()">Entrar como Chofer</button>
</div>

<!-- Dashboard -->
<div id="dashboard">

  <!-- Perfil -->
  <div class="card">
    <div class="perfil">
      <div class="avatar" id="avatar-letra">T</div>
      <div class="perfil-info">
        <div class="nombre" id="perfil-nombre">Taxi</div>
        <div class="numero" id="perfil-numero"></div>
      </div>
    </div>
    <div class="toggle-wrap activo" id="toggle-wrap">
      <div>
        <div class="toggle-label" id="estado-label">🟢 Disponible</div>
        <div class="toggle-sublabel">Recibirás solicitudes de clientes</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-disp" checked onchange="cambiarDisponibilidad()">
        <span class="slider"></span>
      </label>
    </div>
    <button class="btn-ubic" id="btn-ubic" onclick="compartirUbicacion()">
      📍 Compartir mi ubicación (opcional)
    </button>
  </div>

  <!-- Solicitud entrante -->
  <div class="card" id="solicitud-card">
    <div class="solicitud-header">
      <div class="ping"></div>
      Nueva solicitud de carrera
    </div>
    <div class="info-row"><span class="icon">👤</span><span class="valor" id="sol-nombre">—</span></div>
    <div class="info-row"><span class="icon">📞</span><span class="valor" id="sol-telefono">—</span></div>
    <div class="info-row"><span class="icon">📍</span><span class="valor" id="sol-ubicacion">—</span></div>
    <div class="btns-solicitud" id="btns-responder">
      <button class="btn-aceptar" onclick="aceptar()">✅ Aceptar</button>
      <button class="btn-rechazar" onclick="rechazar()">❌ Rechazar</button>
    </div>
    <button class="btn-maps" id="btn-maps" onclick="abrirMaps()" style="display:none">
      🗺️ Abrir ruta en Google Maps
    </button>
    <button class="btn-completar" id="btn-completar" onclick="completarCarrera()">
      🏁 Marcar carrera completada
    </button>
  </div>

</div>

<div id="toast"></div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  const socket = io();
  let solicitudActual = null;
  let watchId = null;

  function registrar() {
    const nombre = document.getElementById('reg-nombre').value.trim();
    const numero = document.getElementById('reg-numero').value.trim();
    if (!nombre) {
      alert('Por favor ingresa tu nombre.');
      document.getElementById('reg-nombre').focus();
      return;
    }
    socket.emit('chofer:registrar', { nombre, numero });
    document.getElementById('reg-nombre').disabled = true;
    document.getElementById('reg-numero').disabled = true;
    document.querySelector('.btn-registrar').disabled = true;
  }

  socket.on('chofer:registrado', () => {
    const nombre = document.getElementById('reg-nombre').value.trim();
    const numero = document.getElementById('reg-numero').value.trim();
    document.getElementById('registro-card').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('avatar-letra').textContent = nombre.charAt(0).toUpperCase();
    document.getElementById('perfil-nombre').textContent = nombre;
    document.getElementById('perfil-numero').textContent = numero || 'Sin número registrado';
    toast('¡Conectado! Ya puedes recibir solicitudes.');
  });

  function cambiarDisponibilidad() {
    const disponible = document.getElementById('toggle-disp').checked;
    socket.emit('chofer:disponibilidad', disponible);
    const wrap = document.getElementById('toggle-wrap');
    const label = document.getElementById('estado-label');
    if (disponible) {
      wrap.classList.add('activo');
      label.textContent = '🟢 Disponible';
    } else {
      wrap.classList.remove('activo');
      label.textContent = '🔴 Ocupado';
    }
  }

  function compartirUbicacion() {
    if (!navigator.geolocation) { alert('Tu navegador no soporta geolocalización.'); return; }
    if (watchId) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      document.getElementById('btn-ubic').textContent = '📍 Compartir mi ubicación (opcional)';
      document.getElementById('btn-ubic').classList.remove('activo');
      return;
    }
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        socket.emit('chofer:ubicacion', { lat: pos.coords.latitude, lng: pos.coords.longitude });
        const btn = document.getElementById('btn-ubic');
        btn.textContent = '✅ Ubicación activa (toca para desactivar)';
        btn.classList.add('activo');
      },
      () => alert('No se pudo obtener tu ubicación.')
    );
  }

  socket.on('solicitud:nueva', (data) => {
    solicitudActual = data;
    document.getElementById('sol-nombre').textContent = data.nombre || '—';
    document.getElementById('sol-telefono').textContent = data.telefono || 'No proporcionado';
    document.getElementById('sol-ubicacion').textContent =
      data.lat ? `${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}` : 'No compartida';
    document.getElementById('btns-responder').style.display = 'grid';
    document.getElementById('btn-maps').style.display = 'none';
    document.getElementById('btn-completar').style.display = 'none';
    const card = document.getElementById('solicitud-card');
    card.classList.add('activa');
    // Vibración en móvil
    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
    sonarAlerта();
    toast('Nueva solicitud de carrera!');
  });

  function sonarAlerта() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.3, 0.6].forEach(t => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.5, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.25);
      });
    } catch(e) {}
  }

  function aceptar() {
    if (!solicitudActual) return;
    socket.emit('chofer:aceptar', { clienteSocketId: solicitudActual.clienteSocketId });
    document.getElementById('toggle-disp').checked = false;
    document.getElementById('toggle-wrap').classList.remove('activo');
    document.getElementById('estado-label').textContent = '🔴 Ocupado';
    document.getElementById('btns-responder').style.display = 'none';
    if (solicitudActual.lat) document.getElementById('btn-maps').style.display = 'block';
    document.getElementById('btn-completar').style.display = 'block';
    toast('✅ Carrera aceptada');
  }

  function rechazar() {
    if (!solicitudActual) return;
    socket.emit('chofer:rechazar', { clienteSocketId: solicitudActual.clienteSocketId });
    solicitudActual = null;
    document.getElementById('solicitud-card').classList.remove('activa');
    toast('Solicitud rechazada');
  }

  function abrirMaps() {
    if (!solicitudActual?.lat) return;
    const url = `https://www.google.com/maps/dir/?api=1&destination=${solicitudActual.lat},${solicitudActual.lng}&travelmode=driving`;
    window.open(url, '_blank');
  }

  function completarCarrera() {
    socket.emit('chofer:completar');
    solicitudActual = null;
    document.getElementById('solicitud-card').classList.remove('activa');
    document.getElementById('toggle-disp').checked = true;
    document.getElementById('toggle-wrap').classList.add('activo');
    document.getElementById('estado-label').textContent = '🟢 Disponible';
    toast('🏁 Carrera completada. Ya estás disponible.');
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
