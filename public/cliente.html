<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedir Taxi</title>
<link rel="manifest" href="/manifest-cliente.json">
<meta name="theme-color" content="#facc15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedir Taxi">
<link rel="apple-touch-icon" href="/icon-cliente.svg">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    padding: 20px 20px 90px;
  }
  h1 { text-align: center; font-size: 1.6rem; margin-bottom: 4px; color: #facc15; }
  .subtitle { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px; }
  .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
  .card h2 { color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.78rem; margin-bottom: 14px; }
  .taxis-resumen {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .resumen-chip {
    flex: 1; text-align: center; padding: 8px 6px;
    border-radius: 10px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    border: 2px solid transparent; transition: border-color 0.2s;
  }
  .resumen-chip.verde { background: #14532d; color: #86efac; }
  .resumen-chip.rojo  { background: #450a0a; color: #fca5a5; }
  .resumen-chip.activo-filtro.verde { border-color: #22c55e; }
  .resumen-chip.activo-filtro.rojo  { border-color: #ef4444; }
  .resumen-chip.todos { background: #1e3a5f; color: #93c5fd; }
  .resumen-chip.activo-filtro.todos { border-color: #3b82f6; }
  .taxi-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #1e293b; }
  .taxi-item:last-child { border-bottom: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.disponible { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot.ocupado    { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
  .taxi-name { font-weight: 600; font-size: 0.88rem; flex: 1; }
  .taxi-status { font-size: 0.72rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; flex-shrink: 0; }
  .taxi-status.disponible { background: #14532d; color: #86efac; }
  .taxi-status.ocupado    { background: #450a0a; color: #fca5a5; }
  .no-taxis { text-align: center; color: #475569; padding: 20px 0; font-size: 0.9rem; }
  .separador-grupo { font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 0 4px; }
  .taxi-dist { font-size: 0.75rem; color: #facc15; font-weight: 700; margin-left: auto; margin-right: 8px; }
  label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #f1f5f9; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: #facc15; }
  .btn-ubicacion { display: flex; align-items: center; gap: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: #94a3b8; padding: 10px 14px; width: 100%; cursor: pointer; margin-top: 14px; font-size: 0.88rem; transition: border-color 0.2s, color 0.2s; }
  .btn-ubicacion.activo { border-color: #22c55e; color: #22c55e; }
  .btn-pedir { width: 100%; padding: 15px; background: #facc15; color: #0f172a; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-top: 18px; transition: background 0.2s, transform 0.1s; }
  .btn-pedir:hover { background: #fde047; }
  .btn-pedir:active { transform: scale(0.98); }
  .btn-pedir:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  /* Voz */
  .voz-wrap { display: none; margin-bottom: 16px; }
  .btn-voz { width: 100%; padding: 14px; background: #1e293b; border: 2px solid #334155; border-radius: 14px; color: #94a3b8; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; user-select: none; -webkit-user-select: none; }
  .btn-voz.grabando { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; animation: pulsoVoz 0.8s ease infinite; }
  @keyframes pulsoVoz { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
  .voz-estado { font-size: 0.78rem; color: #64748b; text-align: center; margin-top: 5px; }
  #estado { display: none; text-align: center; padding: 20px; border-radius: 16px; font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
  #estado.espera   { background: #1c1f14; color: #a3e635; border: 1px solid #4d7c0f; display: block; }
  #estado.aceptada { background: #14532d; color: #86efac; border: 1px solid #15803d; display: block; }
  #estado.rechazada{ background: #450a0a; color: #fca5a5; border: 1px solid #991b1b; display: block; }
  #estado.sinTaxis { background: #1e1b4b; color: #a5b4fc; border: 1px solid #4338ca; display: block; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #a3e63544; border-top-color: #a3e635; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Emergencia ── */
  .btn-auxilio {
    position: fixed;
    bottom: 80px; right: 16px;
    width: 64px; height: 64px;
    background: #dc2626;
    color: white;
    border: none; border-radius: 50%;
    font-size: 1.6rem;
    cursor: pointer;
    box-shadow: 0 0 0 4px #450a0a, 0 4px 20px #dc262688;
    z-index: 150;
    animation: pulsoRojo 2s ease infinite;
    transition: transform 0.1s;
  }
  .btn-auxilio:active { transform: scale(0.92); }
  @keyframes pulsoRojo {
    0%,100% { box-shadow: 0 0 0 4px #450a0a, 0 4px 20px #dc262688; }
    50%      { box-shadow: 0 0 0 8px #450a0a, 0 4px 30px #dc2626cc; }
  }
  .emergencia-overlay {
    display: none;
    position: fixed; inset: 0;
    background: #7f1d1ddd;
    z-index: 999;
    justify-content: center;
    align-items: center;
    padding: 30px;
    backdrop-filter: blur(4px);
  }
  .emergencia-overlay.activa { display: flex; }
  .emergencia-box {
    background: #1c0a0a;
    border: 2px solid #dc2626;
    border-radius: 20px;
    padding: 30px 24px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    animation: shakeIn 0.4s ease;
  }
  @keyframes shakeIn {
    0%  { transform: scale(0.8); opacity: 0; }
    60% { transform: scale(1.05); }
    100%{ transform: scale(1); opacity: 1; }
  }
  .emergencia-icono { font-size: 3rem; margin-bottom: 12px; }
  .emergencia-titulo { font-size: 1.4rem; font-weight: 800; color: #ef4444; margin-bottom: 8px; }
  .emergencia-quien { font-size: 1rem; color: #fca5a5; margin-bottom: 6px; }
  .emergencia-tipo { font-size: 0.82rem; color: #94a3b8; margin-bottom: 20px; }
  .emergencia-mapa { display: inline-block; margin-bottom: 16px; padding: 10px 20px; background: #dc2626; color: white; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
  .emergencia-cerrar { width: 100%; padding: 12px; background: #334155; color: #f1f5f9; border: none; border-radius: 12px; font-size: 0.9rem; cursor: pointer; }

  /* ── Historial ── */
  .section { display: none; }
  .section.activa { display: block; }
  .contador-hist { text-align: center; font-size: 0.82rem; color: #64748b; margin-bottom: 14px; }
  .carrera { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; animation: entrada 0.3s ease; }
  @keyframes entrada { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
  .carrera-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .carrera-num { font-size: 0.75rem; background: #facc15; color: #0f172a; padding: 2px 10px; border-radius: 20px; font-weight: 700; }
  .carrera-fecha { font-size: 0.78rem; color: #64748b; }
  .carrera-fila { display: flex; gap: 10px; margin-top: 6px; font-size: 0.88rem; }
  .carrera-fila .icono { width: 20px; text-align: center; flex-shrink: 0; }
  .vacio-hist { text-align: center; color: #475569; padding: 40px 20px; font-size: 0.9rem; }

  /* ── Barra de navegación ── */
  .nav-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #1e293b;
    border-top: 1px solid #334155;
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
    cursor: pointer;
    border: none;
    background: transparent;
    color: #64748b;
    font-size: 0.7rem;
    gap: 4px;
    transition: color 0.2s;
  }
  .nav-btn .nav-icon { font-size: 1.4rem; }
  .nav-btn.activo { color: #facc15; }
  .nav-badge {
    position: absolute;
    top: 6px;
    right: calc(25% - 18px);
    background: #ef4444;
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    display: none;
  }
</style>
</head>
<body>

<!-- ── SECCIÓN INICIO ── -->
<div class="section activa" id="sec-inicio">
  <h1>🚕 Pedir Taxi</h1>
  <p class="subtitle">Servicio de transporte local</p>
  <div id="estado"></div>
  <div class="card">
    <h2>Taxis activos</h2>
    <div class="taxis-resumen" id="taxis-resumen" style="display:none">
      <div class="resumen-chip todos activo-filtro" onclick="filtrarTaxis('todos')">🚕 Todos</div>
      <div class="resumen-chip verde" id="chip-disp" onclick="filtrarTaxis('disponible')">● 0 Disponibles</div>
      <div class="resumen-chip rojo"  id="chip-ocup" onclick="filtrarTaxis('ocupado')">● 0 Ocupados</div>
    </div>
    <div id="lista-taxis"><p class="no-taxis">Buscando taxis...</p></div>
  </div>
  <div class="voz-wrap" id="voz-wrap-cliente">
    <button class="btn-voz" id="btn-voz-cli" ontouchstart="iniciarGrabacionCliente()" ontouchend="enviarVozCliente()" onmousedown="iniciarGrabacionCliente()" onmouseup="enviarVozCliente()">
      🎤 <span id="voz-label-cli">Mantén para hablarle al chofer</span>
    </button>
    <div class="voz-estado" id="voz-estado-cli"></div>
  </div>
  <div class="card" id="formulario">
    <h2>Tu información</h2>
    <label>Tu nombre</label>
    <input type="text" id="nombre" placeholder="Ej: María García">
    <label>Teléfono (opcional)</label>
    <input type="tel" id="telefono" placeholder="Ej: 099 123 4567">
    <button class="btn-ubicacion" id="btn-ubic" onclick="obtenerUbicacion()">📍 Compartir mi ubicación</button>
    <button class="btn-pedir" id="btn-pedir" onclick="pedirTaxi()">Solicitar Taxi</button>
  </div>
</div>

<!-- ── SECCIÓN HISTORIAL ── -->
<div class="section" id="sec-historial">
  <h1>Historial</h1>
  <p class="subtitle">Carreras completadas</p>
  <div class="contador-hist" id="contador-hist">Cargando...</div>
  <div id="lista-hist"></div>
</div>

<!-- ── BOTÓN AUXILIO ── -->
<button class="btn-auxilio" onclick="activarAuxilio()" title="Botón de emergencia">🆘</button>

<!-- ── ALERTA DE EMERGENCIA ── -->
<div class="emergencia-overlay" id="emergencia-overlay">
  <div class="emergencia-box">
    <div class="emergencia-icono">🚨</div>
    <div class="emergencia-titulo">¡EMERGENCIA!</div>
    <div class="emergencia-quien" id="em-quien">Alguien necesita ayuda</div>
    <div class="emergencia-tipo" id="em-tipo"></div>
    <a class="emergencia-mapa" id="em-mapa" style="display:none" target="_blank">📍 Ver ubicación en Maps</a>
    <button class="emergencia-cerrar" onclick="cerrarEmergencia()">Entendido — Cerrar alerta</button>
  </div>
</div>

<!-- ── BARRA DE NAVEGACIÓN ── -->
<nav class="nav-bar">
  <button class="nav-btn activo" id="nav-inicio" onclick="cambiarTab('inicio')">
    <span class="nav-icon">🏠</span>
    Inicio
  </button>
  <button class="nav-btn" id="nav-historial" onclick="cambiarTab('historial')" style="position:relative">
    <span class="nav-icon">📋</span>
    Historial
    <span class="nav-badge" id="badge-hist"></span>
  </button>
</nav>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  const socket = io();
  let miLat = null, miLng = null, solicitando = false;
  let historialData = [], histAnterior = 0;

  // Cargar datos guardados al abrir la app
  const nombreGuardado = localStorage.getItem('cliente_nombre');
  const telefonoGuardado = localStorage.getItem('cliente_telefono');
  if (nombreGuardado) document.getElementById('nombre').value = nombreGuardado;
  if (telefonoGuardado) document.getElementById('telefono').value = telefonoGuardado;

  // ── Tabs ──
  function cambiarTab(tab) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('activa'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('activo'));
    document.getElementById('sec-' + tab).classList.add('activa');
    document.getElementById('nav-' + tab).classList.add('activo');
    if (tab === 'historial') {
      document.getElementById('badge-hist').style.display = 'none';
      histAnterior = historialData.length;
    }
    window.scrollTo(0, 0);
  }

  // ── Taxis ──
  let taxisData = [], filtroActual = 'todos';

  socket.on('taxis:actualizar', (lista) => {
    taxisData = lista;
    renderTaxis();
  });

  function filtrarTaxis(filtro) {
    filtroActual = filtro;
    document.querySelectorAll('.resumen-chip').forEach(c => c.classList.remove('activo-filtro'));
    const mapa = { todos: 0, disponible: 1, ocupado: 2 };
    document.querySelectorAll('.resumen-chip')[mapa[filtro]].classList.add('activo-filtro');
    renderTaxis();
  }

  function renderTaxis() {
    const div = document.getElementById('lista-taxis');
    const resumen = document.getElementById('taxis-resumen');
    if (!taxisData.length) {
      div.innerHTML = '<p class="no-taxis">No hay taxis registrados aún</p>';
      resumen.style.display = 'none'; return;
    }
    const disponibles = taxisData.filter(t => t.disponible);
    const ocupados    = taxisData.filter(t => !t.disponible);
    document.getElementById('chip-disp').innerHTML = `● ${disponibles.length} Disponible${disponibles.length !== 1 ? 's' : ''}`;
    document.getElementById('chip-ocup').innerHTML = `● ${ocupados.length} Ocupado${ocupados.length !== 1 ? 's' : ''}`;
    resumen.style.display = 'flex';

    // Ordenar disponibles por distancia si el cliente compartió ubicación
    if (miLat && miLng) {
      disponibles.sort((a, b) => {
        const dA = (a.lat && a.lng) ? haversine(miLat, miLng, a.lat, a.lng) : Infinity;
        const dB = (b.lat && b.lng) ? haversine(miLat, miLng, b.lat, b.lng) : Infinity;
        return dA - dB;
      });
    }

    let mostrar = filtroActual === 'disponible' ? disponibles
                : filtroActual === 'ocupado'    ? ocupados
                : [...disponibles, ...ocupados];

    if (!mostrar.length) {
      div.innerHTML = `<p class="no-taxis">No hay taxis ${filtroActual === 'disponible' ? 'disponibles' : 'ocupados'} ahora</p>`;
      return;
    }

    let html = '';
    if (filtroActual === 'todos') {
      if (disponibles.length) html += `<div class="separador-grupo">● Disponibles (${disponibles.length})</div>`;
      html += disponibles.map(t => tarjetaTaxi(t)).join('');
      if (ocupados.length) html += `<div class="separador-grupo">● Ocupados (${ocupados.length})</div>`;
      html += ocupados.map(t => tarjetaTaxi(t)).join('');
    } else {
      html = mostrar.map(t => tarjetaTaxi(t)).join('');
    }
    div.innerHTML = html;
  }

  function tarjetaTaxi(t) {
    let distTexto = '';
    if (miLat && miLng && t.lat && t.lng) {
      const km = haversine(miLat, miLng, t.lat, t.lng);
      distTexto = km < 1
        ? `<span class="taxi-dist">${Math.round(km * 1000)} m</span>`
        : `<span class="taxi-dist">${km.toFixed(1)} km</span>`;
    }
    return `<div class="taxi-item">
      <div class="dot ${t.disponible ? 'disponible' : 'ocupado'}"></div>
      <span class="taxi-name">${t.nombre}</span>
      ${distTexto}
      <span class="taxi-status ${t.disponible ? 'disponible' : 'ocupado'}">${t.disponible ? 'Disponible' : 'Ocupado'}</span>
    </div>`;
  }

  function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ── Solicitud ──
  socket.on('solicitud:enviada', ({ taxiNombre }) => {
    mostrarEstado('espera', `<span class="spinner"></span> Esperando respuesta de ${taxiNombre}...`);
    document.getElementById('formulario').style.opacity = '0.4';
    document.getElementById('btn-pedir').disabled = true;
  });
  socket.on('solicitud:aceptada', ({ choferNombre, choferNumero }) => {
    const tel = choferNumero ? `<br><small>📞 ${choferNumero}</small>` : '';
    mostrarEstado('aceptada', `✅ ¡${choferNombre} aceptó tu solicitud! Ya va en camino.${tel}`);
    document.getElementById('formulario').style.opacity = '1';
    document.getElementById('btn-pedir').disabled = false;
    document.getElementById('voz-wrap-cliente').style.display = 'block';
    solicitando = false;
    sonarConfirmacion();
  });
  socket.on('solicitud:rechazada', () => {
    mostrarEstado('rechazada', '❌ El chofer no pudo aceptar. Intenta de nuevo.');
    document.getElementById('formulario').style.opacity = '1';
    document.getElementById('btn-pedir').disabled = false;
    solicitando = false;
  });
  socket.on('solicitud:sinTaxis', () => {
    mostrarEstado('sinTaxis', '😔 No hay taxis disponibles en este momento.');
    document.getElementById('btn-pedir').disabled = false;
    solicitando = false;
  });
  socket.on('carrera:completada', () => {
    mostrarEstado('espera', 'Tu carrera ha terminado. Puedes pedir otro taxi cuando quieras.');
    document.getElementById('voz-wrap-cliente').style.display = 'none';
    setTimeout(() => {
      document.getElementById('estado').style.display = 'none';
      document.getElementById('formulario').style.opacity = '1';
      document.getElementById('btn-pedir').disabled = false;
      solicitando = false;
    }, 3000);
  });

  // ── Historial ──
  fetch('/api/historial').then(r => r.json()).then(renderHistorial);
  socket.on('historial:actualizar', (data) => {
    renderHistorial(data);
    const tabActiva = document.querySelector('.section.activa')?.id;
    if (tabActiva !== 'sec-historial' && data.length > histAnterior) {
      const badge = document.getElementById('badge-hist');
      badge.textContent = data.length - histAnterior;
      badge.style.display = 'block';
    }
  });

  function renderHistorial(data) {
    historialData = data;
    const lista = document.getElementById('lista-hist');
    const contador = document.getElementById('contador-hist');
    if (!data.length) {
      lista.innerHTML = '<div class="vacio-hist">Todavía no hay carreras completadas.</div>';
      contador.textContent = 'Sin registros aún';
      return;
    }
    contador.textContent = `Total: ${data.length} carrera${data.length !== 1 ? 's' : ''}`;
    lista.innerHTML = data.map((c, i) => `
      <div class="carrera">
        <div class="carrera-header">
          <span class="carrera-num">#${data.length - i}</span>
          <span class="carrera-fecha">${c.fecha}</span>
        </div>
        <div class="carrera-fila"><span class="icono">🚖</span><span>${c.chofer}</span></div>
        <div class="carrera-fila"><span class="icono">👤</span><span>${c.cliente}</span></div>
        <div class="carrera-fila"><span class="icono">📞</span><span>${c.telefono || '-'}</span></div>
      </div>`).join('');
  }

  // ── Helpers ──
  function mostrarEstado(tipo, texto) {
    const el = document.getElementById('estado');
    el.className = tipo; el.innerHTML = texto; el.style.display = 'block';
  }
  function obtenerUbicacion() {
    if (!navigator.geolocation) { alert('Tu navegador no soporta geolocalización.'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      miLat = pos.coords.latitude; miLng = pos.coords.longitude;
      const btn = document.getElementById('btn-ubic');
      btn.textContent = '✅ Ubicación compartida'; btn.classList.add('activo');
      renderTaxis(); // reordenar lista por distancia
    }, () => alert('No se pudo obtener tu ubicación.'));
  }
  function pedirTaxi() {
    if (solicitando) return;
    const nombre = document.getElementById('nombre').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    if (!nombre) { alert('Por favor ingresa tu nombre.'); document.getElementById('nombre').focus(); return; }
    localStorage.setItem('cliente_nombre', nombre);
    localStorage.setItem('cliente_telefono', telefono);
    solicitando = true;
    document.getElementById('btn-pedir').disabled = true;
    socket.emit('cliente:solicitar', { nombre, telefono, lat: miLat, lng: miLng });
  }
  // ── Emergencia ──
  function activarAuxilio() {
    if (!confirm('¿Confirmas que necesitas ayuda de emergencia?\n\nSe avisará a todos los choferes y clientes conectados.')) return;
    const nombre = document.getElementById('nombre').value.trim() || 'Cliente';
    socket.emit('emergencia:activar', { nombre, tipo: 'Cliente', lat: miLat, lng: miLng });
  }

  socket.on('emergencia:alerta', (data) => {
    document.getElementById('em-quien').textContent = `${data.nombre} necesita ayuda urgente`;
    document.getElementById('em-tipo').textContent = `Activado por: ${data.tipo}`;
    const mapa = document.getElementById('em-mapa');
    if (data.lat) {
      mapa.href = `https://www.google.com/maps?q=${data.lat},${data.lng}`;
      mapa.style.display = 'inline-block';
    } else { mapa.style.display = 'none'; }
    document.getElementById('emergencia-overlay').classList.add('activa');
    sonarEmergencia();
    if (navigator.vibrate) navigator.vibrate([500,200,500,200,500]);
  });

  function cerrarEmergencia() {
    document.getElementById('emergencia-overlay').classList.remove('activa');
  }

  function sonarEmergencia() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < 6; i++) {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = i % 2 === 0 ? 960 : 720;
        gain.gain.setValueAtTime(0.6, ctx.currentTime + i * 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.3 + 0.28);
        osc.start(ctx.currentTime + i * 0.3);
        osc.stop(ctx.currentTime + i * 0.3 + 0.28);
      }
    } catch(e) {}
  }

  socket.on('voz:recibida', ({ audio }) => {
    const audioEl = new Audio(audio);
    audioEl.play().catch(() => {});
    const estadoEl = document.getElementById('estado');
    if (!estadoEl.innerHTML.includes('mensaje de voz')) {
      estadoEl.innerHTML += '<br><small>🎤 El chofer te envió un mensaje de voz</small>';
    }
  });

  let mediaRecorderCli = null, audioChunksCli = [];

  async function iniciarGrabacionCliente() {
    if (mediaRecorderCli && mediaRecorderCli.state === 'recording') return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
      mediaRecorderCli = new MediaRecorder(stream, { mimeType });
      audioChunksCli = [];
      mediaRecorderCli.ondataavailable = e => { if (e.data.size > 0) audioChunksCli.push(e.data); };
      mediaRecorderCli.start();
      const btn = document.getElementById('btn-voz-cli');
      btn.classList.add('grabando');
      document.getElementById('voz-label-cli').textContent = '🔴 Grabando... suelta para enviar';
    } catch(e) {
      document.getElementById('voz-estado-cli').textContent = 'No se pudo acceder al micrófono';
    }
  }

  function enviarVozCliente() {
    if (!mediaRecorderCli || mediaRecorderCli.state !== 'recording') return;
    mediaRecorderCli.stop();
    mediaRecorderCli.stream.getTracks().forEach(t => t.stop());
    mediaRecorderCli.onstop = () => {
      const blob = new Blob(audioChunksCli, { type: mediaRecorderCli.mimeType });
      const reader = new FileReader();
      reader.onloadend = () => {
        socket.emit('voz:cliente_enviar', { audio: reader.result, mimeType: mediaRecorderCli.mimeType });
        document.getElementById('voz-estado-cli').textContent = 'Mensaje enviado';
        setTimeout(() => { document.getElementById('voz-estado-cli').textContent = ''; }, 2500);
      };
      reader.readAsDataURL(blob);
      const btn = document.getElementById('btn-voz-cli');
      btn.classList.remove('grabando');
      document.getElementById('voz-label-cli').textContent = 'Mantén para hablarle al chofer';
    };
  }

  function sonarConfirmacion() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [440, 550, 660].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.4, ctx.currentTime + i * 0.18);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.2);
        osc.start(ctx.currentTime + i * 0.18); osc.stop(ctx.currentTime + i * 0.18 + 0.2);
      });
    } catch(e) {}
  }
</script>
</body>
