<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR — Pedir Taxi</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; }
  .card { background: white; border-radius: 24px; padding: 28px 28px 22px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 20px 60px #00000066; }
  .card canvas { display: block; margin: 0 auto; }
  .titulo { font-size: 1.3rem; font-weight: 800; color: #0f172a; margin-top: 18px; margin-bottom: 6px; }
  .url { font-size: 0.72rem; color: #64748b; word-break: break-all; margin-bottom: 4px; }
  .instruccion { margin-top: 24px; text-align: center; color: #94a3b8; font-size: 0.85rem; max-width: 280px; }
  .btn-imprimir { margin-top: 28px; padding: 13px 32px; background: #facc15; color: #0f172a; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .btn-imprimir:active { background: #fde047; }
  @media print {
    body { background: white; justify-content: flex-start; padding: 20px; }
    .btn-imprimir, .instruccion { display: none; }
    .card { box-shadow: none; border: 1px solid #e2e8f0; }
  }
</style>
</head>
<body>

<div class="card">
  <canvas id="qr"></canvas>
  <div class="titulo">🚕 Pedir Taxi</div>
  <div class="url" id="url-texto"></div>
</div>

<p class="instruccion">Muéstrale este código QR a tus clientes.<br>Lo escanean con la cámara del teléfono y abre la app directo.</p>

<button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir QR</button>

<script>
  const url = window.location.origin + '/cliente.html';
  document.getElementById('url-texto').textContent = url;

  QRCode.toCanvas(document.getElementById('qr'), url, {
    width: 240,
    margin: 1,
    color: { dark: '#0f172a', light: '#ffffff' }
  });
</script>
</body>
</html>
